<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Cyber Pulse — Alexandre Rocha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  /* design tokens */
  --bg:#070809; --surface:#0d1117; --surface-2:#11161f; --elev:#151b26;
  --line:#1e2733; --line-2:#2a3441;
  --text:#eef2f6; --muted:#8b98a8; --faint:#5b6675;
  --red:#ff2e4c; --red-soft:rgba(255,46,76,.12);
  --radius:14px; --radius-sm:10px;
  --shadow:0 12px 34px rgba(0,0,0,.45);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:120px}
body{background:
   radial-gradient(1100px 520px at 100% -10%,rgba(255,46,76,.14),transparent 55%),
   var(--bg);
   color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.mono{font-family:'Fira Code',monospace}
.wrap{max-width:1060px;margin:0 auto;padding:26px 18px 70px}

/* header */
.head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.title h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(90deg,#fff,#ff6a80);-webkit-background-clip:text;background-clip:text;color:transparent}
.title .k*{}
.title .k{font-family:'Fira Code',monospace;color:var(--muted);font-size:13px}
.updated{color:var(--faint);font-size:12px;font-family:'Fira Code',monospace;margin-top:4px}
.head .spacer{flex:1}
.back{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border:1px solid var(--line-2);
  border-radius:999px;color:var(--text);font-weight:600;font-size:13px;background:var(--surface)}
.back:hover{border-color:var(--red);color:#fff}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:20;background:rgba(7,8,9,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:14px 0;margin:18px 0}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:0 14px}
.search svg{width:16px;height:16px;fill:var(--faint);flex:0 0 auto}
.search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;
  font-family:'Fira Code',monospace;padding:12px 0}
.select{position:relative}
.select select{appearance:none;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-sm);
  color:var(--text);font-size:13px;font-weight:600;padding:11px 34px 11px 14px;cursor:pointer;outline:none}
.select:after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:12px}
.select select:focus{border-color:var(--red)}
.refresh{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;border:none;
  border-radius:var(--radius-sm);padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.refresh:hover{filter:brightness(1.06)}
.refresh:disabled{opacity:.7;cursor:default}
.refresh svg{width:15px;height:15px;fill:#fff;transition:transform .6s}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.count{margin-left:auto;color:var(--muted);font-size:12.5px;font-family:'Fira Code',monospace}

/* source chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{cursor:pointer;white-space:nowrap;flex:0 0 auto;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted);transition:.14s}
.chip:hover{color:#fff;border-color:var(--red)}
.chip.on{color:#fff;background:var(--red);border-color:var(--red)}

/* list */
.list{display:grid;gap:12px}
.item{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 18px;transition:.14s}
.item:hover{transform:translateY(-2px);border-color:var(--line-2);background:var(--elev);box-shadow:var(--shadow)}
.item .bar{flex:0 0 auto;width:3px;align-self:stretch;border-radius:3px;background:var(--red);opacity:.85}
.item .body{flex:1;min-width:0}
.item h3{font-size:15.5px;font-weight:600;line-height:1.4;margin-bottom:7px}
.item .meta{display:flex;gap:12px;align-items:center;color:var(--faint);font-size:12px;font-family:'Fira Code',monospace}
.item .src{color:#ff8a9b;font-weight:600}
.item .fresh{color:#54e08a}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-family:'Fira Code',monospace}
footer{margin-top:40px;text-align:center;color:var(--faint);font-size:12px}

@media(max-width:560px){ .count{order:5;margin-left:0;width:100%} }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="title">
      <div class="k">root@rochacrypt:~# tail -f /var/log/threat-intel</div>
      <h1>Cyber Pulse</h1>
      <div class="updated" id="updated">loading…</div>
    </div>
    <div class="spacer"></div>
    <a class="back" href="https://www.RochaCrypt.com">← Back to profile</a>
  </div>

  <div class="toolbar">
    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24"><path d="M21 20l-5.6-5.6a7 7 0 10-1.4 1.4L20 21zM4 10a6 6 0 1112 0 6 6 0 01-12 0z"/></svg>
        <input id="q" placeholder="Search headlines…" autocomplete="off"/>
      </div>
      <div class="select">
        <select id="window">
          <option value="0">Any time</option>
          <option value="10">Last 10 min</option>
          <option value="30">Last 30 min</option>
          <option value="60">Last 1 hour</option>
          <option value="120">Last 2 hours</option>
          <option value="360">Last 6 hours</option>
          <option value="720">Last 12 hours</option>
          <option value="1440">Last 24 hours</option>
        </select>
      </div>
      <button class="refresh" id="refresh" title="Refresh now">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
        Refresh
      </button>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips"><span class="chip on" data-src="all">All sources</span></div>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">// nothing matches your filters</div>

  <footer>Aggregated by <b>Alexandre Rocha</b> · headlines link to their original source · <span class="mono">github.com/RochaCrypt</span></footer>
</div>

<script>
let DATA={items:[],sources:[],updated:null};
let curSrc="all", q="", win=0;
const listEl=document.getElementById('list'), emptyEl=document.getElementById('empty'),
      chipsEl=document.getElementById('chips'), countEl=document.getElementById('count'),
      updatedEl=document.getElementById('updated'), refreshBtn=document.getElementById('refresh');

function ago(iso){ if(!iso) return ""; const s=(Date.now()-new Date(iso))/1000;
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago"; }

function buildChips(){
  chipsEl.innerHTML='<span class="chip on" data-src="all">All sources</span>';
  (DATA.sources||[]).forEach(sname=>{
    const c=document.createElement('span');c.className='chip';c.dataset.src=sname;c.textContent=sname;chipsEl.appendChild(c);
  });
  [...chipsEl.children].forEach(c=>c.classList.toggle('on',c.dataset.src===curSrc));
}
function render(){
  const now=Date.now();
  const l=(DATA.items||[]).filter(i=>{
    if(curSrc!=="all" && i.source!==curSrc) return false;
    if(q && !((i.title||"")).toLowerCase().includes(q)) return false;
    if(win>0){ if(!i.date) return false; if((now-new Date(i.date))/60000 > win) return false; }
    return true;
  });
  countEl.textContent=l.length+" / "+(DATA.items||[]).length;
  listEl.innerHTML=''; emptyEl.style.display=l.length?'none':'block';
  for(const i of l){
    const fresh=i.date && (now-new Date(i.date))/60000 <= 60;
    const a=document.createElement('a');a.className='item';a.href=i.url;a.target="_blank";a.rel="noopener";
    a.innerHTML=`<span class="bar"></span><div class="body"><h3>${i.title}</h3>
      <div class="meta"><span class="src">${i.source}</span>
      <span class="${fresh?'fresh':''}">${ago(i.date)}</span></div></div>`;
    listEl.appendChild(a);
  }
}
async function loadNews(){
  refreshBtn.classList.add('spin'); refreshBtn.disabled=true;
  updatedEl.textContent="refreshing…";
  let data=null;
  // 1) try a live endpoint (works if deployed with the serverless function)
  try{ const r=await fetch('/api/news?_='+Date.now()); if(r.ok) data=await r.json(); }catch(_){}
  // 2) fall back to the committed news.json (GitHub Pages)
  if(!data){ try{ const r=await fetch('news.json?_='+Date.now()); if(r.ok) data=await r.json(); }catch(_){} }
  if(data){ DATA=data; buildChips(); render();
    updatedEl.textContent = data.updated ? ("Updated "+new Date(data.updated).toLocaleString()) : "Updated just now";
  } else { updatedEl.textContent="// could not load news"; }
  refreshBtn.classList.remove('spin'); refreshBtn.disabled=false;
}
chipsEl.addEventListener('click',e=>{const c=e.target.closest('.chip'); if(!c)return;
  curSrc=c.dataset.src; [...chipsEl.children].forEach(x=>x.classList.toggle('on',x===c)); render();});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.toLowerCase();render();});
document.getElementById('window').addEventListener('change',e=>{win=parseInt(e.target.value,10)||0;render();});
refreshBtn.addEventListener('click',loadNews);
loadNews();
setInterval(()=>{ /* keep relative times fresh */ render(); }, 60000);
</script>
</body>
</html>
