<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Cyber Pulse — Alexandre Rocha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#08090c;--panel:#0d1117;--panel2:#11161f;--line:#20141a;--text:#e6edf3;--muted:#8b949e;--red:#ff2e4c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:radial-gradient(1200px 500px at 100% -10%,rgba(255,46,76,.18),transparent 60%),var(--bg);
  color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;margin-bottom:16px}
.mono{font-family:'Fira Code',monospace}
h1{font-size:clamp(30px,6vw,50px);font-weight:800;margin:.1em 0 .1em;
  background:linear-gradient(90deg,#fff,#ff2e4c);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:14px}
.back{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:9px 16px;border:1px solid var(--red);
  border-radius:999px;color:#fff;background:rgba(255,46,76,.08);font-weight:600;font-size:13px}
.back:hover{background:var(--red)}
.bar{position:sticky;top:env(safe-area-inset-top,0);z-index:10;background:rgba(8,9,12,.9);backdrop-filter:blur(10px);
  padding:14px 0;margin:16px 0;border-bottom:1px solid var(--line)}
.search{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #23303d;background:var(--panel);
  color:var(--text);font-size:16px;font-family:'Fira Code',monospace;outline:none}
.search:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,46,76,.15)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chip{cursor:pointer;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid #2a2330;
  background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip:hover{color:#fff;border-color:var(--red)}
.chip.on{color:#fff;background:var(--red);border-color:var(--red)}
.count{margin-left:auto;color:var(--muted);font-size:12.5px;font-family:'Fira Code',monospace}
.item{display:block;background:var(--panel);border:1px solid #1c2531;border-left:3px solid var(--red);
  border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:.13s}
.item:hover{transform:translateX(3px);border-color:var(--red);background:var(--panel2)}
.item h3{margin:0 0 6px;font-size:15.5px;font-weight:600;line-height:1.35}
.meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;font-family:'Fira Code',monospace}
.src{color:#ff8a9b;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:50px 0;font-family:'Fira Code',monospace}
footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="mono sub">root@rochacrypt:~# tail -f /var/log/threat-intel</div>
  <h1>Cyber Pulse</h1>
  <div class="sub" id="updated">Live cybersecurity headlines · auto-updated</div>
  <a class="back" href="https://github.com/RochaCrypt">Back to profile</a>
</header>

<div class="bar">
  <input id="q" class="search" placeholder="Search headlines..." autocomplete="off"/>
  <div class="chips" id="chips"><span class="chip on" data-src="all">All sources</span><span class="count" id="count"></span></div>
</div>

<div id="list"></div>
<div class="empty" id="empty" style="display:none">// no headlines match your search</div>

<footer>
  Aggregated by <b>Alexandre Rocha</b> · headlines link to their original source · <span class="mono">github.com/RochaCrypt</span>
</footer>
</div>

<script>
let DATA={items:[],sources:[],updated:null}, cur="all", q="";
const list=document.getElementById('list'), empty=document.getElementById('empty'),
      chips=document.getElementById('chips'), count=document.getElementById('count');

function ago(iso){ if(!iso) return ""; const d=(Date.now()-new Date(iso))/1000;
  if(d<3600) return Math.max(1,Math.floor(d/60))+"m ago";
  if(d<86400) return Math.floor(d/3600)+"h ago";
  return Math.floor(d/86400)+"d ago"; }

function render(){
  const l=DATA.items.filter(i=>(cur==="all"||i.source===cur) &&
    (!q || i.title.toLowerCase().includes(q)));
  count.textContent=l.length+" / "+DATA.items.length;
  list.innerHTML=""; empty.style.display=l.length?"none":"block";
  for(const i of l){
    const a=document.createElement('a');
    a.className='item'; a.href=i.url; a.target="_blank"; a.rel="noopener";
    a.innerHTML=`<h3>${i.title}</h3><div class="meta"><span class="src">${i.source}</span><span>${ago(i.date)}</span></div>`;
    list.appendChild(a);
  }
}
function buildChips(){
  DATA.sources.forEach(s=>{
    const c=document.createElement('span'); c.className='chip'; c.dataset.src=s; c.textContent=s;
    chips.insertBefore(c,count);
  });
  chips.addEventListener('click',e=>{const c=e.target.closest('.chip'); if(!c)return;
    cur=c.dataset.src; [...chips.querySelectorAll('.chip')].forEach(x=>x.classList.toggle('on',x===c)); render();});
}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.toLowerCase();render();});

fetch('news.json?_='+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d;
  if(d.updated) document.getElementById('updated').textContent="Updated "+new Date(d.updated).toLocaleString();
  buildChips(); render();
}).catch(()=>{ empty.textContent="// could not load news.json — run the Action first"; empty.style.display="block"; });
</script>
</body>
</html>
